---
layout: default
---

<h3>Search</h3>

<input type="text" id="search-input" placeholder="Search posts..." style="width: 100%; padding: 8px; font-size: 16px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px;">

<div id="search-results"></div>
<div id="search-pagination" class="pagination"></div>

<script>
(function() {
  var searchInput = document.getElementById('search-input');
  var resultsContainer = document.getElementById('search-results');
  var paginationContainer = document.getElementById('search-pagination');
  var index, store;
  var perPage = {{ site.pagination.per_page | default: 10 }};
  var currentPage = 1;
  var currentResults = [];

  fetch('{{ "/search.json" | relative_url }}')
    .then(function(response) { return response.json(); })
    .then(function(data) {
      store = data;
      index = lunr(function() {
        this.ref('url');
        this.field('title', { boost: 10 });
        this.field('content');
        this.field('categories');

        data.forEach(function(doc) {
          this.add(doc);
        }, this);
      });

      var params = new URLSearchParams(window.location.search);
      var query = params.get('q');
      if (query) {
        searchInput.value = query;
        performSearch(query);
      }
    });

  searchInput.addEventListener('input', function() {
    currentPage = 1;
    performSearch(this.value.trim());
  });

  function performSearch(query) {
    if (!query || !index) {
      resultsContainer.innerHTML = '';
      paginationContainer.innerHTML = '';
      return;
    }

    try {
      currentResults = index.search(query);
    } catch(e) {
      currentResults = index.search(query.replace(/[:\~\^\+\-]/g, ''));
    }

    if (currentResults.length === 0) {
      resultsContainer.innerHTML = '<p>No results found.</p>';
      paginationContainer.innerHTML = '';
      return;
    }

    renderPage();
  }

  function renderPage() {
    var totalPages = Math.ceil(currentResults.length / perPage);
    var start = (currentPage - 1) * perPage;
    var pageResults = currentResults.slice(start, start + perPage);

    var html = '';
    pageResults.forEach(function(result) {
      var item = store.find(function(doc) { return doc.url === result.ref; });
      if (item) {
        html += '<h1><a href="' + item.url + '">' + item.title + '</a></h1>';
        html += '<p class="author"><span class="post-meta">' + item.date + '</span></p>';
        html += '<div class="content">' + item.html + '</div>';
      }
    });
    resultsContainer.innerHTML = html;

    var pag = '';
    if (totalPages > 1) {
      if (currentPage > 1) {
        pag += '<a href="#" class="previous" data-page="' + (currentPage - 1) + '">Previous</a>';
      } else {
        pag += '<span class="previous">Previous</span>';
      }
      pag += '<span class="page_number">Page: ' + currentPage + ' of ' + totalPages + '</span>';
      if (currentPage < totalPages) {
        pag += '<a href="#" class="next" data-page="' + (currentPage + 1) + '">Next</a>';
      } else {
        pag += '<span class="next">Next</span>';
      }
    }
    paginationContainer.innerHTML = pag;

    paginationContainer.querySelectorAll('a[data-page]').forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        currentPage = parseInt(this.getAttribute('data-page'));
        renderPage();
        window.scrollTo(0, 0);
      });
    });
  }
})();
</script>
